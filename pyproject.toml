[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-review"
version = "0.1.0"
description = "Source-traceable aircraft service-difficulty reviews and exposure-aware reliability examples."
requires-python = ">=3.12"
dependencies = ["duckdb==2.0.0", "scipy==1.18.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[project.scripts]
defect-review = "defect_review.review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
defect_review = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
